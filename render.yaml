services:
  - type: web
    name: afg-healthhub-soniox-adapter
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ADAPTER_AUTH_TOKEN
        sync: false
      - key: SONIOX_API_KEY
        sync: false
      - key: SONIOX_STT_MODEL
        value: stt-rt-v5
      - key: SONIOX_STT_AUTO_FINALIZE_SILENCE_MS
        value: "750"
      - key: SONIOX_STT_SILENCE_RMS_THRESHOLD
        value: "200"
      - key: SONIOX_TTS_MODEL
        value: tts-rt-v2
      - key: SONIOX_TTS_VOICE
        value: Adrian
      - key: ADAPTER_LOG_TRANSCRIPTS
        value: "true"
      - key: ADAPTER_HOST
        value: 0.0.0.0
